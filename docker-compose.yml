# NetQuasar — stack: API + UI (binário único), PostgreSQL, Redis.
# Linux (Debian/Ubuntu/VM Proxmox): ver deploy/linux-debian/README.md
# Pré-requisito: .env na raiz (copiar de .env.example). Verificação: bash scripts/verify-compose-env.sh

name: netquasar

services:
  netquasar:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Ex.: PowerShell: $env:CACHEBUST = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds(); docker compose build netquasar
        CACHEBUST: ${CACHEBUST:-0}
    init: true
    restart: unless-stopped
    ports:
      - "${NETQUASAR_PUBLISH_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Forçar stack Compose a usar o serviço postgres (NETQUASAR_DB_*),
      # mesmo que .env ainda tenha NETQUASAR_DATABASE_URL (ex.: Supabase).
      NETQUASAR_DATABASE_URL: ""
      NETQUASAR_HTTP_ADDR: ":8080"
      NETQUASAR_HTTP_WRITE_TIMEOUT: "20m"
      NETQUASAR_EMBEDDED_UI: "true"
      NETQUASAR_DB_HOST: postgres
      NETQUASAR_DB_PORT: "5432"
      NETQUASAR_DB_USER: ${POSTGRES_USER}
      NETQUASAR_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NETQUASAR_DB_NAME: ${POSTGRES_DB}
      NETQUASAR_DB_SSLMODE: disable
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - netquasar_net

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      # 5433 no host evita conflito com Postgres local na 5432
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      # PG 18+ exige montar /var/lib/postgresql (não .../data)
      - netquasar_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - netquasar_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - netquasar_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - netquasar_net

volumes:
  netquasar_pgdata:
  netquasar_redis:

networks:
  netquasar_net:
    driver: bridge
