# NetQuasar — stack: API + UI (binário único), PostgreSQL, Redis.
# Linux (Debian/Ubuntu/VM Proxmox): ver deploy/linux-debian/README.md
# Pré-requisito: .env na raiz (copiar de .env.example). Verificação: bash scripts/verify-compose-env.sh

name: netquasar

services:
  netquasar:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Ex.: PowerShell: $env:CACHEBUST = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds(); docker compose build netquasar
        CACHEBUST: ${CACHEBUST:-0}
        # Versão exibida em Sobre → Versão do sistema — exportar antes do build (o serviço
        # `updater` já faz isto sozinho quando actualiza a partir do GitHub):
        #   GIT_COMMIT=$(git rev-parse HEAD) GIT_COMMIT_SHORT=$(git rev-parse --short HEAD) \
        #   BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) docker compose build netquasar
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_COMMIT_SHORT: ${GIT_COMMIT_SHORT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    init: true
    restart: unless-stopped
    ports:
      - "${NETQUASAR_PUBLISH_PORT:-8080}:8080"
    volumes:
      # Persiste ficheiros gravados em runtime (capturas .pcap do Sniffer, uploads de projeto
      # KML/KMZ, etc.) entre rebuilds/restarts do container — sem isto, tudo em /app/data
      # escrito depois do arranque perdia-se em cada `docker compose up` novo.
      - netquasar_data:/app/data
    env_file:
      - .env
    environment:
      # Forçar stack Compose a usar o serviço postgres (NETQUASAR_DB_*),
      # mesmo que .env ainda tenha NETQUASAR_DATABASE_URL (ex.: Supabase).
      NETQUASAR_DATABASE_URL: ""
      NETQUASAR_HTTP_ADDR: ":8080"
      NETQUASAR_HTTP_WRITE_TIMEOUT: "20m"
      NETQUASAR_EMBEDDED_UI: "true"
      NETQUASAR_DB_HOST: postgres
      NETQUASAR_DB_PORT: "5432"
      NETQUASAR_DB_USER: ${POSTGRES_USER}
      NETQUASAR_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NETQUASAR_DB_NAME: ${POSTGRES_DB}
      NETQUASAR_DB_SSLMODE: disable
      NETQUASAR_REDIS_URL: redis://redis:6379/0
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - netquasar_net

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      # 5433 no host evita conflito com Postgres local na 5432
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      # PG 18+ exige montar /var/lib/postgresql (não .../data)
      - netquasar_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - netquasar_net

  # updater — único serviço com acesso ao socket do Docker e ao checkout do repositório do host;
  # o netquasar nunca fala com Docker/git directamente (superfície de ataque menor, já que é ele
  # que fica exposto à internet). Faz polling de system_update_state (Postgres) e executa
  # git pull + docker compose build/up quando a aba Sobre → Versão do sistema pede uma
  # atualização. Ver deploy/updater/entrypoint.sh.
  updater:
    build:
      context: ./deploy/updater
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    env_file:
      - .env
    environment:
      NETQUASAR_DB_HOST: postgres
      NETQUASAR_DB_PORT: "5432"
      NETQUASAR_DB_USER: ${POSTGRES_USER}
      NETQUASAR_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NETQUASAR_DB_NAME: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - netquasar_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - netquasar_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - netquasar_net

volumes:
  netquasar_pgdata:
  netquasar_redis:
  netquasar_data:

networks:
  netquasar_net:
    driver: bridge
